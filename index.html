<!doctype html>
<html>
  <head>
    <title>My HTML Test</title>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <h1>My HTML Test</h1>
    </header>
    <nav>
      <a href="#picture">Picture</a>
      <a href="#video">Video</a>
      <a href="#contact">Contact Form</a>
    </nav>
    <hr />

    <main>
      <section id="picture">
        <h2>Image Link</h2>

        <p>Click the image to send an email.</p>

        <a href="mailto:someone@example.com">
          <img
            src="https://images.unsplash.com/photo-1593108408993-58ee9c7825c2?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1470&q=80"
            width="900"
            height="600"
            alt="Image"
          />
        </a>
      </section>

      <hr />

      <section id="video">
        <h2>Video Section</h2>

        <video
          width="800"
          controls
          poster="https://assets.codepen.io/32795/poster.png"
        >
          <source
            src="http://media.w3.org/2010/05/sintel/trailer.mp4"
            type="video/mp4"
          />

          <source
            src="http://media.w3.org/2010/05/sintel/trailer.webm"
            type="video/webm"
          />

          <source
            src="http://media.w3.org/2010/05/sintel/trailer.ogv"
            type="video/ogg"
          />
          <track
            src="subtitles_en.vtt"
            kind="subtitles"
            srclang="en"
            label="English"
          />

          <track
            src="subtitles_de.vtt"
            kind="subtitles"
            srclang="de"
            label="German Deutsch"
          />
          Your browser does not support video.
        </video>
      </section>
      <hr />
      <section id="contact">
        <h2>Contact Form</h2>

        <form>
          <fieldset>
            <legend>Contact Form</legend>

            <label>Your Name:</label>
            <br />

            <input type="text" name="name" />

            <br />
            <br />

            <label>Your Phone:</label>
            <br />

            <input
              type="tel"
              name="phone"
              placeholder="+8801773125566"
              pattern="\+8801[3-9][0-9]{8}"
            />

            <br />
            <br />

            <label>Your Email:</label>
            <br />

            <input type="email" name="email" />

            <br />
            <br />

            <label>Your Country:</label>
            <br />

            <select name="country">
              <option>Bangladesh</option>
              <option>India</option>
              <option>Pakistan</option>
              <option>Nepal</option>
              <option>Bhutan</option>
              <option>China</option>
              <option>Japan</option>
              <option>Canada</option>
              <option>Australia</option>
              <option>United States</option>
              <option>United Kingdom</option>
            </select>

            <br />
            <br />

            <label>Your State:</label>
            <br />

            <select name="state">
              <option>Dhaka</option>
              <option>Chattogram</option>
              <option>Rajshahi</option>
              <option>Khulna</option>
              <option>Barishal</option>
              <option>Sylhet</option>
              <option>Rangpur</option>
              <option>Mymensingh</option>
              <option>California</option>
              <option>Texas</option>
              <option>New York</option>
            </select>

            <br />
            <br />

            <label>Your Message:</label>
            <br />

            <textarea name="message" rows="6" cols="50"></textarea>

            <br />
            <br />

            <input type="submit" value="Submit" />

            <input type="reset" value="Reset" />
          </fieldset>
        </form>
      </section>

      <hr />

      <hr />

      <footer>
        <p>Copyright &copy; 2026 My HTML Test</p>
      </footer>
    </main>
  </body>
</html>
